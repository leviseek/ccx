name: CCX CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 平台范围（2026-08-29）：开发环境 = Windows + macOS（Linux 支持已移除）
jobs:
  gates:
    name: 架构门禁（依赖方向 / vendor / schema）
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 门禁 1 依赖方向（铁律 1/6）
        run: node ci/gates/layered_imports.mjs .
      - name: 门禁 2 vendor 纪律（ADR-005）
        run: node ci/gates/vendor_check.mjs .
      - name: 门禁 3 schema round-trip（ADR-003，构建任务强制执行）
        run: node ci/gates/schema_roundtrip.mjs .

  build:
    name: 构建 + ctest（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 加载 MSVC 开发者环境（VS18，runner 实际版本）
        uses: ilammy/msvc-dev-cmd@v1
      - name: 配置（Ninja + MSVC）
        run: cmake -S . -B build/ci-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCCX_BUILD_TESTS=ON
      - name: 构建
        run: cmake --build build/ci-windows
      - name: 测试（Windows）
        working-directory: build/ci-windows
        run: ctest --output-on-failure

  lighthouse-c-bindgen:
    name: 灯塔C bindgen napi 编译冒烟（出口④）
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 加载 MSVC 开发者环境（node-gyp 需要 VCINSTALLDIR）
        uses: ilammy/msvc-dev-cmd@v1
      - name: bindgen 生成 + 单元测试 + 类型检查
        working-directory: tools/bindgen
        run: |
          npm install --no-audit --no-fund
          node --test
          node bin/bindgen.mjs examples/hello.idl --out out
          npx tsc --noEmit --strict out/ccx_hello.d.ts
      - name: napi 编译（CMake 直连 MSVC，绕过 node-gyp 对 VS18 的探测限制）
        shell: pwsh
        working-directory: tools/bindgen/napi
        run: |
          mkdir gen
          copy ..\out\ccx_hello_bindings.cpp gen\
          # --ignore-scripts：gypfile:true 会触发 node-gyp rebuild（VS18 探测失败）；CMake 接管编译
          npm install --no-audit --no-fund --ignore-scripts
          npx node-gyp install 2>&1 | Out-Null
          if (-not (Test-Path "$env:LOCALAPPDATA\node-gyp\Cache")) {
            Write-Error 'node-gyp headers 缓存缺失'
          }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: smoke（JS 调 C++，出口④）
        working-directory: tools/bindgen/napi
        run: node napi_smoke.mjs
